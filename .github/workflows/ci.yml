name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m venv .venv
      - run: .venv/bin/pip install -e './apps/api[dev]'
      - run: npm ci --ignore-scripts
      - run: make lint
      - run: make typecheck
      - run: make test
      - run: make build
      - run: npm audit --audit-level=high
